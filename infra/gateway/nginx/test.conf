events { 
    worker_connections 1024; 
}

http { 
    # Dinamik alt alan adı tespit tablosu
    map $http_host $subdomain_name {
        hostnames;
        "docs.localhost"      "Documentation Project Server (Dokümantasyon)";
        "dashboard.localhost" "Admin Dashboard Server (Yönetim Paneli)";
        default               "Default Localhost Root Gateway (Ana Dizin)";
    }

    # 1. HTTP -> HTTPS Zorunlu Yönlendirme
    server {
        listen 80;
        server_name localhost *.localhost;
        return 301 https://$host$request_uri;
    }

    # 2. HTTPS Sunucusu (Sertifikaları Doğrular ve Doğrudan Metin Basar)
    server {
        listen 443 ssl;
        server_name localhost *.localhost; 

        # mkcert Sertifika Yolları
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Klasör veya dosya aramadan doğrudan tarayıcıya yanıt verir:
        location / {
            default_type text/plain;
            return 200 "Harika! Nginx ayakta ve calisiyor.\nErisim saglanan sunucu: $subdomain_name\nSSL Baglantisi: Guvenli (OK)";
        }
    }
}
